<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Circle of Fifths — Fretboard</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #12131a;
    --panel: #1a1c26;
    --text: #edf0f7;
    --muted-text: #9aa1b5;
    --accent: #7cc4ff;
    --root-color: #ffb454;
    --third-color: #7cc4ff;
    --fifth-color: #8fe38f;
    --border: #2b2e3d;
    --wheel-fill: #22242f;
    --wheel-related: #35506b;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  header {
    padding: 1rem 1.5rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
  }

  header h1 {
    margin: 0;
    font-size: 1.4rem;
    font-weight: 600;
  }

  main {
    display: flex;
    flex-wrap: wrap;
    gap: 1.5rem;
    padding: 1.5rem;
  }

  section.picker {
    flex: 1 1 280px;
    max-width: 340px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1rem;
  }

  section.stage {
    flex: 2 1 480px;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .stage-panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1rem;
  }

  label {
    display: block;
    margin: 0.75rem 0 0.25rem;
    font-size: 0.85rem;
    color: var(--muted-text);
  }

  select {
    width: 100%;
    padding: 0.4rem;
    background: #22242f;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 4px;
  }

  #mode-toggle {
    display: flex;
    gap: 0.5rem;
    margin-top: 0.25rem;
  }

  #mode-toggle button {
    flex: 1;
    padding: 0.4rem;
    background: #22242f;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 4px;
    cursor: pointer;
  }

  #mode-toggle button[aria-pressed="true"] {
    background: var(--accent);
    color: #12131a;
    border-color: var(--accent);
  }

  #view-toggle {
    display: flex;
    gap: 0.5rem;
  }

  #view-toggle button {
    padding: 0.4rem 0.9rem;
    background: #22242f;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 4px;
    cursor: pointer;
    font-size: 0.9rem;
  }

  #view-toggle button[aria-pressed="true"] {
    background: var(--accent);
    color: #12131a;
    border-color: var(--accent);
  }

  [hidden] { display: none !important; }

  #chord-list {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 0.5rem;
    margin-top: 0.5rem;
  }

  #chord-list button {
    padding: 0.5rem;
    background: #22242f;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 4px;
    cursor: pointer;
    font-size: 0.9rem;
  }

  #chord-list button[aria-pressed="true"] {
    background: var(--accent);
    color: #12131a;
    border-color: var(--accent);
  }

  #chord-caption {
    color: var(--muted-text);
    font-size: 0.9rem;
    margin: 0.5rem 0 0;
  }

  .voicing-controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.75rem;
    margin-top: 0.5rem;
    flex-wrap: wrap;
  }

  .voicing-controls button {
    padding: 0.35rem 0.75rem;
    background: #22242f;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 4px;
    cursor: pointer;
    font-size: 0.9rem;
  }

  .voicing-controls button:disabled {
    opacity: 0.4;
    cursor: default;
  }

  .play-button {
    padding: 0.35rem 0.75rem;
    background: #22242f;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 4px;
    cursor: pointer;
    font-size: 0.9rem;
  }

  .play-button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .play-button:disabled { opacity: 0.4; cursor: default; }

  .triad-play-controls { display: flex; justify-content: flex-end; margin-top: 0.5rem; }

  .note-marker { cursor: pointer; }
  .note-marker:focus-visible { outline: none; stroke: var(--accent); stroke-width: 3; }
  .note-marker text { pointer-events: none; user-select: none; }

  #voicing-position {
    color: var(--muted-text);
    font-size: 0.85rem;
    min-width: 5rem;
    text-align: center;
  }

  svg {
    width: 100%;
    height: auto;
    display: block;
  }

  .triad-controls {
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
  }

  .triad-controls > div {
    flex: 1 1 160px;
  }

  .explorer-controls {
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
    align-items: flex-end;
  }

  .explorer-controls > div {
    flex: 1 1 160px;
  }

  .explorer-controls > .triad-play-controls {
    flex: 0 0 auto;
    margin-top: 0.5rem;
  }

  .fret-line { stroke: #4a4e69; }
  .fret-line.nut { stroke: #edf0f7; stroke-width: 4; }
  .string-line { stroke: #9aa1b5; }
  .fret-inlay { fill: #2b2e3d; }

  .explorer-marker {
    cursor: pointer;
  }

  .explorer-marker:focus-visible {
    outline: none;
    stroke: var(--accent);
    stroke-width: 3;
  }

  .explorer-marker .explorer-label {
    pointer-events: none;
    user-select: none;
  }

  .legend {
    display: flex;
    gap: 1rem;
    margin-top: 0.5rem;
    font-size: 0.85rem;
    color: var(--muted-text);
  }

  .legend span {
    display: inline-flex;
    align-items: center;
  }

  .legend span.swatch {
    display: inline-block;
    width: 0.7rem;
    height: 0.7rem;
    border-radius: 50%;
    margin-right: 0.3rem;
    vertical-align: middle;
    flex: 0 0 auto;
  }

  .wheel-heading { margin: 0 0 .5rem; font-size: 1rem; font-weight: 600; }
  .wheel-caption { margin: .35rem 0 0; font-size: .8rem; color: var(--muted-text); text-align: center; }
  .wheel-wedge { fill: var(--wheel-fill); stroke: var(--border); stroke-width: 1; cursor: pointer; transition: fill .12s ease; }
  .wheel-wedge:hover { fill: #2e3140; }
  .wheel-wedge:focus-visible { outline: none; stroke: var(--accent); stroke-width: 2.5; }
  .wheel-wedge.is-related { fill: var(--wheel-related); }
  .wheel-wedge.is-neighbor { stroke: var(--muted-text); stroke-width: 1.75; }
  .wheel-wedge.is-selected { fill: var(--accent); stroke: #fff; stroke-width: 2; }
  .wheel-label { pointer-events: none; user-select: none; fill: var(--text); font-size: 13px; text-anchor: middle; dominant-baseline: middle; }
  .wheel-label.minor { font-size: 11px; fill: var(--muted-text); }
  .wheel-label.on-selected { fill: #12131a; font-weight: 600; }
</style>
</head>
<body>
<header>
  <h1>Circle of Fifths — Fretboard</h1>
  <div id="view-toggle" role="radiogroup" aria-label="Main view">
    <button id="view-chord" type="button" role="radio" aria-pressed="true" data-view="chord">Chord diagram</button>
    <button id="view-triad" type="button" role="radio" aria-pressed="false" data-view="triad">Triad layout</button>
    <button id="view-explorer" type="button" role="radio" aria-pressed="false" data-view="explorer">Fretboard explorer</button>
  </div>
</header>
<main>
  <section class="picker">
    <h2 class="wheel-heading">Circle of fifths</h2>
    <svg id="circle-wheel" viewBox="0 0 320 320" role="group" aria-label="Circle of fifths"></svg>
    <p id="wheel-caption" class="wheel-caption" aria-live="polite"></p>

    <label for="key-select">Key</label>
    <select id="key-select" aria-label="Key"></select>

    <label id="mode-label">Mode</label>
    <div id="mode-toggle" role="radiogroup" aria-labelledby="mode-label">
      <button id="mode-major" type="button" role="radio" aria-pressed="true">Major</button>
      <button id="mode-minor" type="button" role="radio" aria-pressed="false">Minor</button>
    </div>

    <label id="chord-list-label">Diatonic chords</label>
    <div id="chord-list" role="group" aria-labelledby="chord-list-label"></div>
  </section>

  <section class="stage">
    <div class="stage-panel" id="chord-panel">
      <h2>Chord diagram</h2>
      <svg id="chord-diagram" viewBox="0 0 320 160" aria-label="Chord fingering diagram"></svg>
      <div class="voicing-controls">
        <button id="voicing-prev" type="button" aria-label="Previous voicing">&#8592; Prev</button>
        <span id="voicing-position" aria-live="polite"></span>
        <button id="voicing-next" type="button" aria-label="Next voicing">Next &#8594;</button>
        <button id="chord-play" type="button" class="play-button" aria-label="Play chord">&#9654; Play chord</button>
        <button id="progression-play" type="button" class="play-button" aria-label="Play progression">&#9654; Play progression</button>
      </div>
      <p id="chord-caption" aria-live="polite"></p>
    </div>

    <div class="stage-panel" id="triad-panel" hidden>
      <h2>Triad layout</h2>
      <div class="triad-controls">
        <div>
          <label for="inversion-select">Inversion</label>
          <select id="inversion-select" aria-label="Inversion">
            <option value="root">Root position</option>
            <option value="first">First inversion</option>
            <option value="second">Second inversion</option>
          </select>
        </div>
        <div>
          <label for="string-set-select">String set</label>
          <select id="string-set-select" aria-label="String set">
            <option value="0">E–A–D</option>
            <option value="1">A–D–G</option>
            <option value="2" selected>D–G–B</option>
            <option value="3">G–B–E</option>
          </select>
        </div>
      </div>
      <div class="triad-play-controls">
        <button id="triad-play" type="button" class="play-button" aria-label="Play triad">&#9654; Play triad</button>
      </div>
      <svg id="triad-diagram" viewBox="0 0 320 160" aria-label="Triad layout diagram"></svg>
      <div class="legend">
        <span><span class="swatch" style="background: var(--root-color);"></span>Root</span>
        <span><span class="swatch" style="background: var(--third-color);"></span>Third</span>
        <span><span class="swatch" style="background: var(--fifth-color);"></span>Fifth</span>
      </div>
      <p id="triad-caption" aria-live="polite"></p>
    </div>

    <div class="stage-panel" id="explorer-panel" hidden>
      <h2>Fretboard explorer</h2>
      <div class="explorer-controls">
        <div>
          <label for="explorer-filter">Filter notes</label>
          <select id="explorer-filter" aria-label="Filter notes">
            <option value="chord" selected>Selected chord notes</option>
            <option value="key">Key / scale notes</option>
          </select>
        </div>
        <div>
          <label for="explorer-label-mode">Marker labels</label>
          <select id="explorer-label-mode" aria-label="Marker labels">
            <option value="name" selected>Note name (e.g. C, E, G)</option>
            <option value="role">Role / degree (e.g. R, 3rd, 5th)</option>
            <option value="pc">Pitch class (0–11)</option>
          </select>
        </div>
        <div class="triad-play-controls">
          <button id="explorer-play" type="button" class="play-button" aria-label="Play all neck notes">&#9654; Play all</button>
        </div>
      </div>
      <svg id="explorer-diagram" viewBox="0 0 740 180" role="img" aria-label="12-fret guitar fretboard diagram"></svg>
      <div class="legend">
        <span><span class="swatch" style="background: var(--root-color);"></span>Root</span>
        <span><span class="swatch" style="background: var(--third-color);"></span>Third</span>
        <span><span class="swatch" style="background: var(--fifth-color);"></span>Fifth</span>
        <span><span class="swatch" style="background: var(--accent);"></span>Scale / Other</span>
      </div>
      <p id="explorer-caption" class="wheel-caption" aria-live="polite"></p>
    </div>
  </section>
</main>
<script type="module" src="./main.ts"></script>
</body>
</html>
