# targets/greenfield.yaml — a named target: a clean-room repo a sandbox can mount
# instead of this one. HOST-ONLY: targets/ is never synced to the target repo.
#
#   just target sync greenfield --push      regenerate the clean room's factory from HEAD
#   just sbx mount <id> --target greenfield mount a VM on it (pinned to the last pushed sync)
#
# app: + source: are a manifest, read by adws/adw_modules/manifest.py --target greenfield.
# target: is read only by sandbox_mount/host/target_sync.py and harvest.
app:                                  # MUST equal the checkout's own app.manifest.yaml app: section (sync enforces)
  name: app
  dir: apps/app
  entry: apps/app/main.ts                    # bun build target for typecheck/build
  test_file: apps/app/app.test.ts            # the fixed suite — grows with the app
  generated_tests_dir: apps/app/tests/generated  # TDD phase writes red suites here
source:
  repo: https://github.com/ronpwood/greenfield-sandboxes.git   # what FILL clones into the VM
target:
  checkout: ../greenfield-sandboxes   # relative to this repo's root
  branch: main
  sync_paths:                         # factory allowlist, exported from HEAD via git archive
    - adws
    - just
    - sandbox_mount
    - .claude/skills/sssf
    - justfile
    - .env.sample
    - LICENSE
  owned:                              # target-owned; sync never writes or deletes these
    - apps/app
    - app.manifest.yaml
    - prompts
    - README.md
    - .gitignore
  # The clean room's definition of "blank": pristine_paths must equal this commit
  # (the empty shell), and every tracked path must sit under sync_paths or owned.
  # Sync refuses (exit 5) otherwise — that is what a sandbox run merged into main
  # looks like. Bump pristine ONLY by a deliberate edit here, when the shell itself
  # is meant to change, so the decision is recorded in this repo's history.
  # 2026-09-17: bumped from c9b98d1e1dbd (empty shell) to add the render smoke to
  # apps/app/app.test.ts. `bun test` has no DOM, so main.ts's module-scope render
  # was never executed by the suite — the typecheck gate catches undeclared names,
  # but only a test that actually renders catches code that type-checks and then
  # throws while drawing. This is the first deliberate bump, and it is what the
  # escape hatch is for: the guard correctly refused (exit 5) until this line moved.
  # 2026-09-18: bumped from 0382e275 to replace the hand-rolled DOM stub with
  # happy-dom (+ apps/app/package.json, bun.lock). The stub was an attractive
  # nuisance: it looked like a DOM, so agents coded against its internals, and
  # two arms shipped browser crashes that `bun test` called green. A real DOM
  # fails the same way the browser does — verified against both crashed arms'
  # actual main.ts. `configurable: false` on the document binding is the part
  # that catches the redefine-document class.
  # 2026-09-18b: bumped from 4d6e63bd to add apps/app/declarations.d.ts, so an
  # `import "./styles.css"` passes the typecheck gate instead of failing TS2882
  # on code that builds and runs. Both ways of adding styles now pass.
  # 2026-09-20: bumped from 4a6dfc83 to add apps/app/test-dom.ts (a shared test
  # DOM) and move app.test.ts onto it. The grading command runs the fixed and
  # generated suites in ONE process with ONE module registry, and the shell was
  # shipping two traps into that gap: app.test.ts demonstrated a happy-dom
  # install that throws at module load when a generated suite copies it, and a
  # bare `import` of the entry from the second file is a cache hit that renders
  # nothing. An arm paid 1.14M tokens for the first on 2026-09-20 and never
  # wrote product code; another solved it by weakening `configurable`. The
  # harness installs the DOM once and hands out fresh app instances, so neither
  # trap is reachable and no guard was relaxed. This is what the escape hatch is
  # for: the shell itself is meant to change.
  pristine: 4d9af3e64916e1bb257d072b4abd17705bc0f872
  pristine_paths:
    - apps
  leak_patterns:                      # extra, target-specific; app names are derived, never listed
    - circle of fifths
    - circle-of-fifths
